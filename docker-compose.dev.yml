# Local-dev only: spins up Postgres + builds images locally.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resitly
      POSTGRES_PASSWORD: resitly
      POSTGRES_DB: resitly_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: apps/web/.env
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
